openapi: 3.1.0
info:
  title: Comité de Contención — API base
  version: 1.0.0
  description: Contrato de implementación. No hay servicio desplegado. Los ejemplos
    son mocks construidos a mano; no demuestran simulación ni hashes. Errores de infraestructura
    fuera del backend pueden no usar el envoltorio de aplicación.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: http://localhost:8000/v1
  description: Referencia local; servidor no implementado
security: []
paths:
  /reports/mayor:
    post:
      operationId: mayorReport
      summary: Informe educativo para alcaldía desde un experimento completo
      description: Valida integridad y recalcula agregados; no ejecuta el motor ni certifica validez epidemiológica. Máximo 32 MiB de entrada; PDF reproducible sin almacenamiento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./experiment-result.schema.json
      responses:
        '200':
          description: PDF adjunto, plantilla mayor-report-v1
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: JSON inválido
          content:
            application/json:
              schema:
                $ref: ./error.schema.json
        '405':
          description: Método no permitido
          content:
            application/json:
              schema:
                $ref: ./error.schema.json
        '413':
          description: Documento o PDF demasiado grande
          content:
            application/json:
              schema:
                $ref: ./error.schema.json
        '422':
          description: Experimento incompleto o inconsistente
          content:
            application/json:
              schema:
                $ref: ./error.schema.json
        '500':
          description: No se pudo generar el informe
          content:
            application/json:
              schema:
                $ref: ./error.schema.json
  /health:
    get:
      operationId: health
      summary: health
      responses:
        '200':
          description: Resultado completo; ejemplos solo de contrato.
          content:
            application/json:
              schema:
                $ref: ./health-result.schema.json
              examples:
                health-response:
                  summary: Mock de contrato; no ejecución real
                  externalValue: ./examples/health-response.json
        '429':
          description: Error de aplicación saneado.
          x-error-codes:
          - RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: ./error.schema.json
              examples:
                error-429-rate-limited:
                  summary: Mock de contrato; no ejecución real
                  externalValue: ./examples/error-429-rate-limited.json
          headers:
            Retry-After:
              description: Opcional, segundos de espera si el servicio los conoce.
              schema:
                type: integer
                minimum: 0
        '500':
          description: Error de aplicación saneado.
          x-error-codes:
          - INTERNAL_ERROR
