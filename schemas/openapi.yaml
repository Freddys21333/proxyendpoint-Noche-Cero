  /jobs:
    post:
      operationId: jobsCreate
      summary: Crear trabajo Monte Carlo asíncrono
      requestBody:
        required: true
        description: JSON estricto <=64 KiB. Configuración completa con repetitions 2..10000.
        content:
          application/json:
            schema:
              $ref: ./job-create-request.schema.json
      responses:
        '202':
          description: Trabajo creado y aceptado para ejecución
          content:
