openapi: 3.1.0
info:
  title: Comité de Contención — API base
  version: 1.0.0
  description: Contrato de implementación. No hay servicio desplegado. Los ejemplos son mocks construidos
    a mano; no demuestran simulación ni hashes. Errores de infraestructura fuera del backend pueden no
    usar el envoltorio de aplicación.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: http://localhost:8000/v1
  description: Referencia local; servidor no implementado
security: []
paths:
  /health:
    get:
      operationId: health
      summary: health
      responses:
        '200':
          description: Resultado completo; ejemplos solo de contrato.
          content:
            application/json:
              schema:
                $ref: ./health-result.schema.json
              examples:
                health-response:
                  summary: Mock de contrato; no ejecución real
                  externalValue: ./examples/health-response.json
        '429':
          description: Error de aplicación saneado.
          x-error-codes: &id001
          - RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: ./error.schema.json
              examples:
                error-429-rate-limited:
                  summary: Mock de contrato; no ejecución real
                  externalValue: ./examples/error-429-rate-limited.json
          headers:
            Retry-After:
              description: Opcional, segundos de espera si el servicio los conoce.
              schema:
                type: integer
                minimum: 0
        '500':
          description: Error de aplicación saneado.
          x-error-codes: &id002
          - INTERNAL_ERROR
          - SIMULATION_FAILED
          content:
            application/json:
              schema:
                $ref: ./error.schema.json
              examples:
                error-500-internal-error:
                  summary: Mock de contrato; no ejecución real
                  externalValue: ./examples/error-500-internal-error.json
                error-500-simulation-failed:
                  summary: Mock de contrato; no ejecución real
                  externalValue: ./examples/error-500-simulation-failed.json
        '503':
          description: Error de aplicación saneado.
          x-error-codes: &id003
          - COMPUTE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: ./error.schema.json
              examples:
                error-503-compute-unavailable:
                  summary: Mock de contrato; no ejecución real
                  externalValue: ./examples/error-503-compute-unavailable.json
