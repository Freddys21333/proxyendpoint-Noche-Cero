  /jobs/{jobId}:
    get:
      operationId: jobsGet
      summary: Consultar estado de un trabajo
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estado actual del trabajo
          content:
            application/json:
              schema:
                $ref: ./job-status-response.schema.json
        '404':
          description: Error de aplicación saneado
          x-error-codes: &id005
          - JOB_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: ./error.schema.json
  /jobs/{jobId}/cancel:
    post:
      operationId: jobsCancel
      summary: Cancelar un trabajo en ejecución
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
