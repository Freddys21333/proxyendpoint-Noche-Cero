[project]
name = "zombie-management-backend"
version = "0.1.0"
description = "Motor reproducible de simulación y contención SEIR sobre grafos."
requires-python = "==3.12.*"
dependencies = [
    "boto3==1.43.120",
    "jsonschema==4.26.0",
    "networkx==3.7",
    "numpy==2.5.4",
    "reportlab==5.1.0",
]

[dependency-groups]
dev = [
    "moto[dynamodb,s3,stepfunctions]==5.2.5",
    "jsonschema[format]==4.26.0",
    "mypy==1.20.2",
    "openapi-spec-validator==0.9.0",
    "pypdf==6.21.3",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "ruff==0.17.2",
    "types-jsonschema==4.26.0.20261006",
    "types-networkx==3.6.1.20261024",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
strict = true
warn_unreachable = true
show_error_codes = true
